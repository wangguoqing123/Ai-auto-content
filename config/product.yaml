product:
  id: ai-never-fall-behind-club
  name: AI 不掉队俱乐部
  brand_line: 七天假的 AI 实战社群
  owner: 七天假
  product_type: long_term_practice_learning_community

positioning:
  primary: "AI 不掉队俱乐部，是一个面向已经开始接触 AI、但还没有稳定用起来的人，以学习路径、基础课程、工具实操、完整项目、真实案例和社群交流，帮助用户把 AI 逐步接入内容、工作和真实业务的长期实践学习社群。"
  core_promise: 不是追每一个新工具，而是把 AI 真正用起来。
  transformation:
    from:
      - 收藏很多 AI 工具和教程。
      - 会基础对话，但输出不稳定。
      - 会单个工具，却不会完成完整任务。
      - 每次使用都从零开始。
      - 不知道先学什么、后学什么。
      - 一个人摸索，遇到问题不知道怎样继续。
    to:
      - 能按真实结果选择工具。
      - 能稳定完成日常任务。
      - 能拆解复杂任务。
      - 能把多个工具组成工作流。
      - 能把跑通的方法沉淀成 Skill、模板或可复用流程。
      - 能把 AI 接入内容、工作和真实业务。
  final_goal: 把 AI 稳定接入自己的内容、工作和真实业务。

audience:
  primary:
    - 已经开始接触 AI，但还没有稳定用起来、没有形成完整方法和工作流的人。
  suitable_for:
    - 会基础对话，但希望输出更稳定的人。
    - 学过单个工具，但希望完成真实任务和完整项目的人。
    - 希望把 AI 接入内容、工作或真实业务的人。
    - 愿意亲手实践、检查结果并持续迭代的人。
    - 希望在遇到具体问题时进入社群交流的人。
  not_suitable_for:
    - 只想购买后自动获得收入或业务结果的人。
    - 需要一对一代做、即时响应或固定服务 SLA 的人。
    - 不愿实践，只想收藏更多工具和教程的人。
    - 主要需求是模型训练、算法研究或论文研究的人。

learning_method:
  first_use_instruction: 先选择未来 2～4 周最想完成的一个成果，一次只走一条路径。
  principles:
    - id: practice_first
      name: 实践优先，用结果判断工具。
      explanation: 不追最新模型和最长工具清单，以真实任务结果判断工具是否值得使用。
    - id: ask_ai_first
      name: 遇事不决，先问 AI。
      explanation: 先把目标、背景和资料交给 AI，帮助梳理、尝试和排查；AI 解决不了，再带具体问题进入社群交流。
    - id: share_real_practice
      name: 真实实践，值得被分享。
      explanation: 分享什么有效、哪里卡住、哪些地方失败、最后怎样调整；真实过程比漂亮结果更有价值。

mechanisms:
  - id: membership_knowledge_base
    name: 会员知识库
    facts:
      - 提供工具、方法、教程和案例。
      - 可以表达“持续更新”。
    constraints:
      - 不能自动表达具体更新频率、每周新增数量或固定更新时间。
  - id: clear_learning_path
    name: 清晰学习路径
    facts:
      - 第一次进入时，先选择未来 2～4 周最想完成的一个结果。
      - 一次只走一条学习路径。
      - 不是先把所有工具学一遍。
    constraints: []
  - id: real_project_practice
    name: 真实项目拆解
    facts:
      - 强调真实任务、真实过程和可复用实践。
      - 可以展示失败点和调整过程。
    constraints:
      - 使用“跑通过、真实项目、能够复用、实测有效”等表达时，必须绑定具体项目证据。
  - id: community_exchange
    name: 社群交流同行
    facts:
      - 可以在群内提问和交流。
      - 遇到问题可以带到社群讨论。
    constraints:
      - 当前不能承诺固定回复时间、固定答疑场次或即时响应 SLA。

learning_architecture:
  shared_foundation:
    - id: ai_foundation_cognition
      name: AI 基础认知
      topics:
        - AI 模型、工具、智能体和工作流的基本区别。
        - 工具选择。
        - AI 能做什么、不能做什么。
    - id: stable_ai_usage
      name: 稳定使用 AI
      topics:
        - 提示词基本结构。
        - 上下文和参考资料。
        - 复杂任务拆解。
        - 检查、纠正和迭代 AI 输出。
    - id: agents_and_workflows
      name: 智能体与工作流
      topics:
        - 知识库。
        - Skill。
        - MCP。
        - 多工具协同。
        - 可重复运行的工作流。
  practice_tracks:
    - id: ai_content_creation
      name: AI 内容创作
      description: 把 AI 接入账号定位、素材、选题、创作、交付、复盘与可复用内容系统。
      module_ids:
        - ai_content_automation
    - id: ai_video_production
      name: AI 视频生产
      description: 海报确认的实战方向；当前目录截图不足以证明完整交付范围。
      module_ids:
        - ai_video_production
    - id: ai_tools_and_productivity
      name: AI 小工具与工作提效
      description: 通过 Codex 与多工具场景完成文档、表格、飞书、原型、邮件、Agent 和工作流任务。
      module_ids:
        - codex_foundation
        - codex_practice
        - ai_tools_and_productivity

