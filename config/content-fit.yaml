  - module_id: beginner_ai_course
    content_pillar_ids: [orientation_and_selection, stable_ai_usage, agents_and_workflows]
  - module_id: ai_content_automation
    content_pillar_ids: [content_automation]
  - module_id: codex_foundation
    content_pillar_ids: [stable_ai_usage, codex_and_productivity]
  - module_id: codex_practice
    content_pillar_ids: [agents_and_workflows, codex_and_productivity]
  - module_id: complete_projects
    content_pillar_ids: [projects_cases_and_templates]
  - module_id: real_case_library
    content_pillar_ids: [projects_cases_and_templates]
  - module_id: templates_and_downloads
    content_pillar_ids: [projects_cases_and_templates]
  - module_id: course_updates_and_curation
    content_pillar_ids: [curation_and_community]
  - module_id: faq_and_help
    content_pillar_ids: [orientation_and_selection]
  - module_id: ai_video_production
    content_pillar_ids: [ai_video_production]
  - module_id: ai_tools_and_productivity
    content_pillar_ids: [codex_and_productivity]

fit_rules:
  requires_explicit_module_match: true
  unrelated_ai_topic_score: 0
  product_fit_score_range:
    min: 0
    max: 10
  delivery_status_score_caps:
    confirmed_delivered: 10
    confirmed_partial: 7
    confirmed_container: 5
    direction_confirmed_delivery_unverified: 3
    unknown: 0
  rules:
    - 不能因为话题和 AI 有关就得到产品适配分，必须对应实际课程或交付模块。
    - 海报方向不能自动当成完整交付。
    - 产品适配分不能覆盖用户价值和证据不足。
    - AI 视频交付进一步人工确认前最高只能得到 3 分。

cta_rules:
  none:
    allowed_delivery_statuses:
      - confirmed_delivered
      - confirmed_partial
      - confirmed_container
      - direction_confirmed_delivery_unverified
      - unknown
    description: 产品关系弱时只提供独立价值，不强行承接。
  light:
    allowed_delivery_statuses:
      - confirmed_delivered
      - confirmed_partial
      - confirmed_container
      - direction_confirmed_delivery_unverified
    description: 只提示这类问题适合系统学习，不直接销售或补全未确认权益。
  club:
    allowed_delivery_statuses:
      - confirmed_delivered
      - confirmed_partial
    description: 只在真实交付直接承接、免费内容已完整解决一个小问题时使用。
    constraints:
      - 必须明确对应 confirmed_delivered 或 confirmed_partial 模块。
      - 产品承接是更系统的路径、更多实践或社群交流。
      - 不能故意省略关键步骤逼迫付费。
      - direction_confirmed_delivery_unverified 模块不能使用 club CTA。

editorial_lens:
  status: applies_to_all_content
  steps:
    - 先定义问题。
    - 明确任务目标。
    - 建立判断标准。
    - 根据任务选择工具。
    - 设计工作流。
    - 设置验收标准。
    - 复盘和迭代。

platform_scope:
  active_content_outputs:
    - wechat_official_account
    - x
    - wechat_visuals
  retired_content_outputs:
    - xiaohongshu
