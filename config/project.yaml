project:
  name: AI Auto Content
  version: 0.3.0
  owner: 七天假
  updated_at: 2026-08-14

product_profile: config/product.yaml
content_fit_profile: config/content-fit.yaml

account:
  primary_identity: 互联网产品经理
  supporting_identities:
    - 独立开发者
    - AI 工具实践者
    - AI 教程创作者
    - AI 不掉队俱乐部主理人
  target_segments:
    beginner: 0.55
    light_intermediate: 0.35
    intermediate: 0.10
  core_user_definition: 已经开始接触 AI，但还没有稳定用起来、没有形成完整方法和工作流的人

platforms:
  - wechat_official_account
  - x
  - wechat_visuals

content_mix:
  status: strategy_hypothesis
  weights:
    orientation_and_selection: 0.20
    stable_ai_usage: 0.20
    agents_and_workflows: 0.15
    content_automation: 0.20
    codex_and_productivity: 0.15
    projects_cases_and_templates: 0.05
    curation_and_community: 0.05
    ai_video_production: 0.00
  rationale: AI 视频当前为 0 不是永久决策；交付深度经人工确认后再调整。

thresholds:
  topic_approval_score: 80
  quality_publish_score: 85
  max_new_concepts_per_piece: 3
  preferred_max_core_steps: 5

human_gate:
  enabled: true
  checks:
    - no_overpromise_in_title
    - first_person_is_true
    - viewpoint_is_approved
    - product_cta_is_appropriate
