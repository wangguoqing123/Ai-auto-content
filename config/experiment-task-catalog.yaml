    name: Meeting notes to decision log
    description: Convert synthetic meeting notes into decisions, owners, next steps, and acceptance conditions.
    synthetic_input: |
      Synthetic meeting notes: The team chose a two-week pilot. Mei will draft the checklist by Friday.
      Rui will recruit three internal testers. The pilot stops if any sample contains private customer data.
      Success means all testers can complete the checklist without a live walkthrough.
    required_deliverable_fields:
