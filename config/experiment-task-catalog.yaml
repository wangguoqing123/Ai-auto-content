        description: Missing inputs are explicitly recorded.
      - criterion_id: executable_next_steps
        description: At least one action has an owner, next step, and acceptance condition.
      - criterion_id: acceptance_mapped
        description: The output includes itemized acceptance checks.
      - criterion_id: assumptions_bounded
        description: Unsupported assumptions are not presented as facts.
      - criterion_id: strict_output_format
        description: The output passes the shared strict schema.
      - criterion_id: no_major_supplementation
