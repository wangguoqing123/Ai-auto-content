name: Daily Topic Selection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: daily-topic-selection-main
  cancel-in-progress: false

jobs:
  disabled:
    if: vars.TOPIC_SELECTION_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Topic selection is disabled
        run: echo "DISABLED"

  select:
    if: vars.TOPIC_SELECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOPIC_LLM_PROVIDER: ${{ vars.TOPIC_LLM_PROVIDER }}
      TOPIC_LLM_MODEL: ${{ vars.TOPIC_LLM_MODEL }}
      TOPIC_LLM_BASE_URL: ${{ vars.TOPIC_LLM_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check product truth
        run: npm run product:check

      - name: Check topic schemas
        run: npm run schema:check

      - name: Select the daily topic
        run: npm run topic:select

      - name: Stage and validate the output whitelist
        id: changes
        shell: bash
        run: |
          git add data/topic-decisions data/topic-runs reports/topics
          npm run topic:paths:check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit daily decision
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          topic_date="$(TZ=Asia/Shanghai date +%F)"
          git commit -m "chore(topic): decide daily topic ${topic_date}"

      - name: Rebase once and push main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "Main advanced with a conflict; retained the local topic commit and stopped."
            exit 1
          fi
          git push origin HEAD:main
