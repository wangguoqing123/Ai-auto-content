name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Check JSON Schema drift
        run: npm run schema:check

      - name: Run tests
        run: npm test

      - name: Run fixture collection
        run: npm run collect:fixture

      - name: Run offline local scheduler fixture
        run: npm run local:scheduler -- --once --fixture --dry-run --now=2026-08-14T00:00:00.000Z

      - name: Validate LaunchAgent installer dry-run
        run: npm run local:install -- --dry-run
